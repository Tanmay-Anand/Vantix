spring.application.name=vantix-demo

# Credentials come from the environment only; nothing is hard-coded here.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.open-in-view=false

# Phase 1: Vantix does not emit Flyway migrations yet (that is Phase 2), so for now Hibernate
# creates the demo schema. Once `vantix migrate dev` exists this becomes `validate` and Flyway
# applies the generated SQL -- never `update` in production.
spring.jpa.hibernate.ddl-auto=${DEMO_DDL_AUTO:create}
spring.flyway.enabled=false
