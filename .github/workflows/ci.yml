name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · test · format · boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify runs: compile, unit tests, Spotless check, enforcer (Java/Maven baseline +
      # banned-Spring in core/runtime), and the ArchUnit module-boundary tests.
      - name: mvn verify
        run: ./mvnw -B --no-transfer-progress verify

  error-prone:
    name: Static analysis (error-prone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn -Perror-prone verify
        run: ./mvnw -B --no-transfer-progress -Perror-prone verify

  boot-portability:
    # The GENERATED entity/repository contract must compile and run on both supported Boot baselines
    # (IMPLEMENTATION_PLAN.md U1): the demo app is regenerated by the reactor-built plugin and its
    # end-to-end tests (Testcontainers PostgreSQL) run against each Boot/Hibernate pair.
    name: Boot portability (${{ matrix.boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [ '3.5.16', '4.1.0' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify (demo app on Boot ${{ matrix.boot }})
        run: ./mvnw -B --no-transfer-progress verify -pl examples/demo-app -am -Dspring-boot.version=${{ matrix.boot }}

  # ---------------------------------------------------------------------------------------------
  # Phase 2 matrix job, scaffolded here so the intent is committed; enable when the work lands.
  #
  # postgres-matrix:
  #   Run vx-migrate SQL-renderer / introspection Testcontainers tests across PostgreSQL 14-17
