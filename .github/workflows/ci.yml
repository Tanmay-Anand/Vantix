name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · test · format · boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify runs: compile, unit tests, Spotless check, enforcer (Java/Maven baseline +
      # banned-Spring in core/runtime), and the ArchUnit module-boundary tests.
      - name: mvn verify
        run: ./mvnw -B --no-transfer-progress verify

  error-prone:
    name: Static analysis (error-prone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn -Perror-prone verify
        run: ./mvnw -B --no-transfer-progress -Perror-prone verify

